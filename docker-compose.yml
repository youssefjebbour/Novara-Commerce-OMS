name: novara
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["127.0.0.1:${MYSQL_PORT:-3307}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DEMO_SEED: ${DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      API_PORT: 8081
      UPLOAD_DIR: /app/uploads
    ports: ["127.0.0.1:${API_PORT:-8081}:8081"]
    volumes: ["uploads:/app/uploads"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
  storefront:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: {APP: storefront}
    restart: unless-stopped
    ports: ["127.0.0.1:5174:80"]
    depends_on:
      backend: {condition: service_healthy}
  admin:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: {APP: admin}
    restart: unless-stopped
    ports: ["127.0.0.1:5175:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  mysql-data:
  uploads:
