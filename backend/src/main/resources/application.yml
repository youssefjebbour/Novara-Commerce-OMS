server:
  port: ${API_PORT:8081}
  error:
    include-message: never
spring:
  application:
    name: novara-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/novara?serverTimezone=UTC}
    username: ${MYSQL_USER:novara}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS:http://localhost:5174,http://localhost:5175,http://127.0.0.1:5174,http://127.0.0.1:5175}
  seed: ${DEMO_SEED:false}
  demo-password: ${DEMO_PASSWORD:}
  upload-dir: ${UPLOAD_DIR:uploads}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
